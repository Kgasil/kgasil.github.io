name: GRAAL security inventory
on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 2'
  push:
    branches: [main]
    paths:
      - '.github/workflows/graal-security-inventory.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify pinned packages and manifest capability baseline without execution
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          for project in genesis rubedo argus aeris lilium; do
            git clone --depth 1 --branch main "https://github.com/Kgasil/$project.git" "$RUNNER_TEMP/$project"
          done
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, zipfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          packages = {
              "genesis": ("Genesis-Mini-v0.1.0-install.zip", "654d46b77439a4c196bd6c70bda0fc664f1f59e8a6fe745cad76e10ed7fc67b4", "0.1.0"),
              "rubedo": ("Rubedo-Mini-v1.0.0-install.zip", "1799dc6ccadd786eb960f38c4f7d67cf241e9630942a9e69daebfe96fcfe6ab2", "1.0.0"),
              "argus": ("Argus-Mini-v0.1.0-install.zip", "3248c6c204b5651a9f63c5630547e1a18f021a0ffdc08feaba1566e7925fb8b1", "0.1.0"),
              "aeris": ("Aeris-Extension-v1.0.0-install.zip", "e77e6e8596c14e54f22303e7a5d368356c19eaa79df8c8597752790755d9a0d9", "1.0.0"),
          }
          def require(ok, message):
              if not ok:
                  raise SystemExit(message)
          def digest(path):
              require(path.is_file() and not path.is_symlink(), f"Missing or nonregular file: {path.name}")
              require(path.stat().st_size <= 32 * 1024 * 1024, f"Unexpected size: {path.name}")
              return hashlib.sha256(path.read_bytes()).hexdigest()
          def check_manifest(project, m, version):
              require(m.get("manifest_version") == 3 and m.get("version") == version, f"{project}: version changed; review required")
              for field in ("permissions", "host_permissions", "optional_permissions", "optional_host_permissions", "content_scripts", "background", "externally_connectable", "web_accessible_resources", "declarative_net_request", "user_scripts"):
                  expected = {"permissions": ["activeTab", "scripting", "storage"], "optional_host_permissions": ["http://127.0.0.1/*"]}.get(field, []) if project == "aeris" else []
                  require(m.get(field, []) == expected, f"{project}: capability {field} changed; review required")
              if project == "aeris":
                  expected = {"default-src":"'none'","script-src":"'self'","style-src":"'self'","img-src":"'self'","object-src":"'none'","connect-src":"http://127.0.0.1:11434","base-uri":"'none'","form-action":"'none'","frame-src":"'none'"}
                  csp = m.get("content_security_policy", {}).get("extension_pages", "")
                  require(dict(s.strip().split(None,1) for s in csp.split(";") if s.strip()) == expected, "aeris: CSP changed")
          rows = []
          for project, (name, expected, version) in packages.items():
              path = root / project / "downloads" / name
              require(digest(path) == expected, f"{project}: package digest changed; review required")
              with zipfile.ZipFile(path) as archive:
                  names = [i for i in archive.infolist() if i.filename == "manifest.json"]
                  require(len(names) == 1 and names[0].file_size <= 65536, f"{project}: unexpected manifest")
                  manifest = json.loads(archive.read(names[0]))
              check_manifest(project, manifest, version)
              if project != "aeris":
                  source = root / project / "extension" / "manifest.json"
                  require(json.loads(source.read_text(encoding="utf-8")) == manifest, f"{project}: source/package manifest differs")
              rows.append({"project":project,"version":version,"sha256":expected,"manifest_baseline":"PASS","installation":"SUSPENDED" if project in {"genesis","argus"} else "MANUAL"})
          full = root / "aeris" / "downloads" / "Aeris-Extension-v1.0.0-completa.zip"
          require(digest(full) == "d0f064c1b73c46465171cc1fb208b530ed66573e054c2ca211b216547bbb3c00", "aeris: full-source ZIP changed")
          p = root / "lilium" / "extension" / "manifest.json"
          manifest = json.loads(p.read_text(encoding="utf-8"))
          check_manifest("lilium", manifest, "0.1.1")
          require(set(manifest) == {"manifest_version","name","version","description","action","icons"}, "lilium: manifest fields changed")
          blob = subprocess.check_output(["git","-C",str(root/"lilium"),"hash-object",str(p)], text=True).strip()
          require(blob == "e1abd929ef84c5088d6e65a2f02a549b59e5a109", "lilium: pinned manifest changed")
          rows.append({"project":"lilium","version":"0.1.1","git_manifest_blob":blob,"manifest_baseline":"PASS","installation":"MANUAL","package_sha256":"NOT_TESTED"})
          for row in rows:
              repo = root / row["project"]
              row["commit"] = subprocess.check_output(["git","-C",str(repo),"rev-parse","HEAD"],text=True).strip()
              row["root_license_files"] = sorted(p.name for p in repo.iterdir() if p.is_file() and p.name.lower().startswith(("license","licence","copying","notice")))
              row["root_dependency_files"] = sorted(p.name for p in repo.iterdir() if p.is_file() and (p.name.startswith("requirements") or p.name in {"package.json","package-lock.json","pyproject.toml","uv.lock","poetry.lock"}))
          print(json.dumps({"records":rows,"malware_scan":"NOT_TESTED","native_acceptance":"NOT_TESTED","license_review":"NOT_TESTED","release_approved":False},ensure_ascii=False,indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as summary:
              summary.write("Pinned package and manifest checks completed. See log for exact commits and inventory. No execution, malware scan, license clearance, native acceptance or release approval. Genesis and Argus remain suspended.\n")
          PY
